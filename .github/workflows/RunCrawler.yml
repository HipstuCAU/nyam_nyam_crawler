name: Run_Crawler

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish validated DTO to Firestore and develop'
        type: boolean
        default: false
  push:
    branches: [develop]

permissions:
  contents: write

concurrency:
  group: cau-menu-crawler
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: pip install -r Crawler/Doc/requirements.txt
      - name: Test API conversion and failure handling
        run: python -m unittest discover -s Crawler -v
      - name: Crawl and validate DTO
        run: python Crawler/main.py --no-upload
      - name: Save result DTO
        uses: actions/upload-artifact@v4
        with:
          name: CAUMealData-DTO
          path: Crawler/Doc/CAUMealData.json
          if-no-files-found: error
      - name: Publish validated DTO
        if: github.ref == 'refs/heads/develop' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        env:
          FIREBASE_SERVICEACCOUNTKEY: ${{ secrets.FIREBASE_SERVICEACCOUNTKEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from google.cloud import firestore
          from google.oauth2 import service_account
          from Crawler.main import DATA_PATH, menu_count
          data = json.loads(DATA_PATH.read_text(encoding="utf-8"))
          if menu_count(data) == 0:
              raise RuntimeError("Refusing to publish empty DTO")
          credentials = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["FIREBASE_SERVICEACCOUNTKEY"]))
          client = firestore.Client(project=credentials.project_id, credentials=credentials)
          document = client.collection("CAU_Haksik").document("CAU_Cafeteria_Menu")
          document.set(data)
          if document.get().to_dict() != data:
              raise RuntimeError("Firestore read-back does not match DTO")
          print(f"Firestore verified: {menu_count(data)} menus")
          PY
      - name: Commit and push menu data
        if: github.ref == 'refs/heads/develop' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        run: |
          git config --local user.email "hth3396@gmail.com"
          git config --local user.name "Auto - update CrawlingData"
          git add Crawler/Doc/CAUMealData.json
          if git diff --cached --quiet; then
            echo "No menu change to commit."
          else
            git commit -m "Auto - Update data with Crawling"
            git push origin HEAD:develop
          fi
